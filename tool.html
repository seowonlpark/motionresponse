<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shifting in motion · the instrument</title>
<meta name="description" content="Physical motion translated to visual effects. Pose tracking turns movement into colour, shape and spin in real time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="backdrop" aria-hidden="true"></div>

<main id="gate" class="gate">
  <div class="gate-inner">
    <p class="sub" id="status" role="status" aria-live="polite">starting…</p>
  </div>
</main>

<section id="stage" class="stage" hidden>
  <canvas id="view" aria-label="The kaleidoscope, driven by your movement"></canvas>
</section>

<script type="module">
  import { createBackdrop } from './backdrop.js';
  createBackdrop(document.getElementById('backdrop'), { chroma: 0.4, speed: 0.03 });
</script>
<script type="module" src="main.js"></script>
</body>
</html>
